name: Build Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      # Build público: sem apoio.json (o convite fica desligado). Para ter o convite, gere o .exe na sua máquina.
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Baixador --add-data "web;web" --collect-all yt_dlp main.py
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: dist/Baixador.exe }
